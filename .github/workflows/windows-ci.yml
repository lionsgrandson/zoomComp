name: Windows CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Syntax checks
        shell: pwsh
        run: |
          node --check src/main/main.js
          node --check src/main/gemini.js
          node --check src/main/settings.js
          node --check src/main/prompts.js
          node --check src/preload.cjs
          node --check src/renderer/app.js
          node --check src/renderer/audio-worklet.js
      - name: Package Windows app
        run: npm run pack
